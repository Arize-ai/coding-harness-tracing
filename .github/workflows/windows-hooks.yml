name: Claude Code hooks (Windows)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      WINDOWS_GIT_BASH: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Create isolated Python environment
        shell: pwsh
        run: |
          $homePath = Join-Path $env:RUNNER_TEMP "windows-hook-home"
          New-Item -ItemType Directory -Force -Path $homePath | Out-Null
          $env:USERPROFILE = $homePath
          $env:HOME = $homePath
          $venv = Join-Path $homePath ".arize\harness\venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $venvPython = Join-Path $venv "Scripts\python.exe"
          if (-not (Test-Path $venvPython)) {
            throw "The virtual environment Python was not created: $venvPython"
          }
          $env:HARNESS_PYTHON = $venvPython
          "WINDOWS_HOOK_TEST_HOME=$homePath" >> $env:GITHUB_ENV
          "USERPROFILE=$homePath" >> $env:GITHUB_ENV
          "HOME=$homePath" >> $env:GITHUB_ENV
          "HARNESS_PYTHON=$venvPython" >> $env:GITHUB_ENV

      - name: Install checked out package
        shell: pwsh
        run: |
          & $env:HARNESS_PYTHON -m pip install --isolated --quiet --disable-pip-version-check --no-deps --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $env:HARNESS_PYTHON -m pip install .
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify registered hooks deliver through Git Bash
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            $windowsTests = Join-Path $env:GITHUB_WORKSPACE "tests/windows"
            & $env:HARNESS_PYTHON -m unittest discover -s $windowsTests -p "test_hook_delivery.py" -k registered -v
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }
