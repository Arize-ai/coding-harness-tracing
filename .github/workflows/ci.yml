name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests/ -m "not slow"

  windows-offline:
    name: Windows offline install (install.bat --wheel-dir)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      # The rest of the suite only reads install.bat as text — cmd does not exist
      # on the Linux runners. This job is the one place the batch actually runs,
      # so a broken block, a bad label or a delayed-expansion mistake fails here
      # instead of on a user's machine.
      - name: Build a local wheelhouse
        shell: cmd
        run: |
          python -m pip install --quiet --upgrade pip wheel
          python -m pip wheel --no-deps -w wheelhouse . || exit /b 1
          python -m pip download --only-binary :all: --no-deps -d wheelhouse python-dotenv || exit /b 1
          dir /b wheelhouse

      # USERPROFILE is what install.bat derives INSTALL_DIR from, so pointing it
      # at a scratch directory keeps the runner's real profile untouched and makes
      # the assertions below unambiguous.
      - name: Offline install, no prompts
        shell: cmd
        env:
          ARIZE_ENV_FILE: ${{ github.workspace }}\creds.env
        run: |
          mkdir "%GITHUB_WORKSPACE%\fakehome" 2>nul
          > "%GITHUB_WORKSPACE%\creds.env" echo ARIZE_API_KEY=ci-not-a-real-key
          >>"%GITHUB_WORKSPACE%\creds.env" echo ARIZE_SPACE_ID=ci-space
          >>"%GITHUB_WORKSPACE%\creds.env" echo ARIZE_LOG_PROMPTS=true
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call install.bat claude --wheel-dir "%GITHUB_WORKSPACE%\wheelhouse" --non-interactive
          if errorlevel 1 ( echo install.bat failed & exit /b 1 )

      - name: Verify the install reports healthy
        shell: cmd
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call "%USERPROFILE%\.arize\harness\install.bat" status --json
          if errorlevel 1 ( echo status reported unhealthy & exit /b 1 )

      - name: Verify nothing was downloaded
        shell: cmd
        run: |
          set "HARNESS=%GITHUB_WORKSPACE%\fakehome\.arize\harness"
          if exist "%HARNESS%\pyproject.toml" ( echo source tree present - wheel mode fetched the repo & exit /b 1 )
          if exist "%HARNESS%\.git" ( echo git clone present - wheel mode fetched the repo & exit /b 1 )
          if not exist "%HARNESS%\install.bat" ( echo install.bat was not placed for later commands & exit /b 1 )
          echo No source tree, and the bootstrap was placed.

      - name: Verify update refuses without a source tree
        shell: cmd
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call "%USERPROFILE%\.arize\harness\install.bat" update
          if not errorlevel 1 ( echo update should have refused & exit /b 1 )
          echo update refused, as intended.

      - name: Verify uninstall cleans up
        shell: cmd
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call "%USERPROFILE%\.arize\harness\install.bat" uninstall
          if errorlevel 1 ( echo uninstall failed & exit /b 1 )

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: python -m pip install pre-commit

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --show-diff-on-failure --color=always --all-files
