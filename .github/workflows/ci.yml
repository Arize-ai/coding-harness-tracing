name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests/ -m "not slow"

  windows-offline:
    name: Windows offline install (install.bat --wheel-dir)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      # The rest of the suite only reads install.bat as text — cmd does not exist
      # on the Linux runners. This job is the one place the batch actually runs,
      # so a broken block, a bad label or a delayed-expansion mistake fails here
      # instead of on a user's machine.
      - name: Build a local wheelhouse
        shell: cmd
        run: |
          python -m pip install --quiet --upgrade pip wheel
          python -m pip wheel --no-deps -w wheelhouse . || exit /b 1
          python -m pip download --only-binary :all: --no-deps -d wheelhouse python-dotenv || exit /b 1
          dir /b wheelhouse

      # USERPROFILE is what install.bat derives INSTALL_DIR from, so pointing it
      # at a scratch directory keeps the runner's real profile untouched and makes
      # the assertions below unambiguous.
      - name: Offline install, no prompts
        shell: cmd
        env:
          ARIZE_ENV_FILE: ${{ github.workspace }}\creds.env
        run: |
          mkdir "%GITHUB_WORKSPACE%\fakehome" 2>nul
          > "%GITHUB_WORKSPACE%\creds.env" echo ARIZE_API_KEY=ci-not-a-real-key
          >>"%GITHUB_WORKSPACE%\creds.env" echo ARIZE_SPACE_ID=ci-space
          >>"%GITHUB_WORKSPACE%\creds.env" echo ARIZE_LOG_PROMPTS=true
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call install.bat claude --wheel-dir "%GITHUB_WORKSPACE%\wheelhouse" --non-interactive
          if errorlevel 1 ( echo install.bat failed & exit /b 1 )

      - name: Verify the install reports healthy
        shell: cmd
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call "%USERPROFILE%\.arize\harness\install.bat" status --json
          if errorlevel 1 ( echo status reported unhealthy & exit /b 1 )

      - name: Verify nothing was downloaded
        shell: cmd
        run: |
          set "HARNESS=%GITHUB_WORKSPACE%\fakehome\.arize\harness"
          if exist "%HARNESS%\pyproject.toml" ( echo source tree present - wheel mode fetched the repo & exit /b 1 )
          if exist "%HARNESS%\.git" ( echo git clone present - wheel mode fetched the repo & exit /b 1 )
          if not exist "%HARNESS%\install.bat" ( echo install.bat was not placed for later commands & exit /b 1 )
          echo No source tree, and the bootstrap was placed.
          REM cmd carries ERRORLEVEL over from earlier commands; be explicit.
          exit /b 0

      - name: Verify update refuses without a source tree
        shell: cmd
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call "%USERPROFILE%\.arize\harness\install.bat" update
          if not errorlevel 1 ( echo update should have refused & exit /b 1 )
          echo update refused, as intended.
          REM The refusal set ERRORLEVEL 1 on purpose, and echo does not clear it,
          REM so without this the step fails despite the assertion passing.
          exit /b 0

      # Asserts the outcome, not the exit code. A full uninstall deletes the
      # directory install.bat is running from, and on Windows cmd emits "The
      # system cannot find the path specified" and a non-zero code afterwards even
      # though the removal succeeded. That wart predates --wheel-dir and fixing it
      # properly needs the script to re-exec from elsewhere before wiping, which
      # is a change for its own PR. What matters here is that the install is gone.
      - name: Verify uninstall removes the install
        shell: cmd
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\fakehome"
          call "%USERPROFILE%\.arize\harness\install.bat" uninstall
          if exist "%USERPROFILE%\.arize\harness\venv" ( echo venv survived the uninstall & exit /b 1 )
          if exist "%USERPROFILE%\.arize\harness\config.json" ( echo config survived the uninstall & exit /b 1 )
          echo Uninstall removed the install directory.
          exit /b 0

      # Reproduces the bug raised in review: a failed offline reinstall used to
      # let update carry on and report success. A directory holding a corrupt
      # wheel of the right name passes the --wheel-dir precondition and then makes
      # pip fail, which is the only way to exercise this path.
      - name: A failed reinstall fails the update
        shell: cmd
        env:
          ARIZE_ENV_FILE: ${{ github.workspace }}\creds.env
        run: |
          set "USERPROFILE=%GITHUB_WORKSPACE%\updhome"
          mkdir "%USERPROFILE%" 2>nul
          call install.bat claude --wheel-dir "%GITHUB_WORKSPACE%\wheelhouse" --non-interactive
          if errorlevel 1 ( echo setup install failed & exit /b 1 )

          mkdir "%GITHUB_WORKSPACE%\badwheels" 2>nul
          > "%GITHUB_WORKSPACE%\badwheels\coding_harness_tracing-9.9.9-py3-none-any.whl" echo not a wheel

          call "%USERPROFILE%\.arize\harness\install.bat" update --wheel-dir "%GITHUB_WORKSPACE%\badwheels" > "%GITHUB_WORKSPACE%\upd.log" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%GITHUB_WORKSPACE%\upd.log"
          if "%RC%"=="0" ( echo update returned 0 despite a failed reinstall & exit /b 1 )
          findstr /c:"Update complete" "%GITHUB_WORKSPACE%\upd.log" >nul && ( echo update claimed success after a failed reinstall & exit /b 1 )
          echo Failed reinstall correctly aborted the update.
          exit /b 0

      # run_harness_py replaced four call sites that repo mode uses too, so the
      # normal network install has to be exercised as well — otherwise this job
      # would pass while the path almost every Windows user takes was broken.
      # A separate profile so it cannot inherit anything from the wheel install.
      - name: Repo-mode install still works
        shell: cmd
        env:
          ARIZE_ENV_FILE: ${{ github.workspace }}\creds.env
        run: |
          mkdir "%GITHUB_WORKSPACE%\repohome" 2>nul
          set "USERPROFILE=%GITHUB_WORKSPACE%\repohome"
          call install.bat claude --non-interactive
          if errorlevel 1 ( echo repo-mode install failed & exit /b 1 )
          if not exist "%USERPROFILE%\.arize\harness\pyproject.toml" ( echo no source tree - repo mode did not fetch & exit /b 1 )
          call "%USERPROFILE%\.arize\harness\install.bat" status --json
          if errorlevel 1 ( echo status reported unhealthy after repo-mode install & exit /b 1 )
          echo Repo-mode install and status both fine.
          exit /b 0

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: python -m pip install pre-commit

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --show-diff-on-failure --color=always --all-files
